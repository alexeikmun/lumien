[package]
name = "lumien-app"
version = "0.1.0"
edition = "2021"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
lumien-protocol = { path = "../../crates/lumien-protocol" }
lumien-device = { path = "../../crates/lumien-device" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
