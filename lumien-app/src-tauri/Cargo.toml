[package]
name = "lumien-app"
version = "0.1.0"
edition = "2021"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
lumien-telemetry = { path = "../../crates/lumien-telemetry" }
tauri = { version = "2", features = ["tray-icon"] }
lumien-protocol = { path = "../../crates/lumien-protocol" }
lumien-device = { path = "../../crates/lumien-device" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"

[profile.release]
strip = true
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
